services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetinghub-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5000
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/rooms.db
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meetinghub-frontend
    ports:
      - "4200:80"
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
